plugins {
	id 'java'
	id 'org.springframework.boot' version '3.1.4'
	id 'io.spring.dependency-management' version '1.1.2'
}

group = 'com.pl'
version = 'nadgodziny 1.0'

java {
	sourceCompatibility = '17'
}

repositories {
	mavenCentral()
}

dependencies {
	implementation group: 'com.twilio.sdk', name: 'twilio', version: '8.0.0'
	implementation 'com.opencsv:opencsv:5.5.2'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'jakarta.validation:jakarta.validation-api'
	implementation 'org.hibernate.validator:hibernate-validator'

	//security
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'io.jsonwebtoken:jjwt-api:0.11.5'
	runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.11.5'
	runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.11.5' // do parsowania JSON

	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'org.springframework.security:spring-security-test'
	testImplementation 'org.mockito:mockito-junit-jupiter:5.5.0'
	testImplementation 'org.testcontainers:testcontainers:1.19.0'
	testImplementation 'org.testcontainers:junit-jupiter:1.19.0'
	testImplementation 'org.testcontainers:mysql:1.19.0'
	runtimeOnly 'com.mysql:mysql-connector-j'
	compileOnly 'org.projectlombok:lombok'
	annotationProcessor 'org.projectlombok:lombok'
}

configurations {
	configureEach {
		exclude group: 'commons-logging', module: 'commons-logging'
	}
}

tasks.named('test') {
		useJUnitPlatform()
//		environment "DB", System.getenv("DB")
//		environment "DB_ADMIN", System.getenv("DB_ADMIN")
//		environment "DB_PW", System.getenv("DB_PW")
//		environment "TWILIO_USER", System.getenv("TWILIO_USER")
//		environment "TWILIO_TOKEN", System.getenv("TWILIO_TOKEN")
//		environment "USER_FROM", System.getenv("USER_FROM")
//		environment "USER_TO", System.getenv("USER_TO")

}

allprojects {
	tasks.withType(Test).configureEach {
		environment "DB", System.getenv("DB")
		environment "DB_ADMIN", System.getenv("DB_ADMIN")
		environment "DB_PW", System.getenv("DB_PW")
		environment "TWILIO_USER", System.getenv("TWILIO_USER")
		environment "TWILIO_TOKEN", System.getenv("TWILIO_TOKEN")
		environment "USER_FROM", System.getenv("USER_FROM")
		environment "USER_TO", System.getenv("USER_TO")
	}
}

