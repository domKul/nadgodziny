spring:
  banner:
    location: banner.txt

  datasource:
    url: ${DB}
    username: ${DB_ADMIN}
    password: ${DB_PW}

  jpa:
    database: mysql
    show-sql: false
    hibernate:
      ddl-auto: update

twilio:
  message:
    body: Dodaj nadgodziny
  account:
    user: ${TWILIO_USER}
    token: ${TWILIO_TOKEN}

  phone:
    number:
      to: ${USER_TO}
      from: ${USER_FROM}

scheduling:
  enabled: false
  request:
     delay: 0 0 14 * * SAT
 #   delay: 0 * * * * *
application:
  version: Version 1.3.0

convert:
  csv:
    path: "OvertimeList.csv"
